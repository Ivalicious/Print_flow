<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrintFlow">
<meta name="theme-color" content="#0d0d0d">
<title>PrintFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--card:#161616;--card2:#1e1e1e;--border:#272727;
  --green:#22c55e;--gbg:#0a1f12;--gborder:#166534;
  --yellow:#f59e0b;--ybg:#1c1500;--yborder:#92400e;
  --red:#ef4444;--rbg:#1c0a0a;--rborder:#7f1d1d;
  --blue:#60a5fa;--bbg:#0a0f1c;--bborder:#1e3a5f;
  --text:#f5f5f5;--t2:#a3a3a3;--t3:#525252;
  --font:'Inter',sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{padding-top:var(--st);padding-bottom:calc(68px + var(--sb))}

/* ONBOARDING */
#ob{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.ob-logo{font-size:2.8rem;font-weight:900;margin-bottom:6px}
.ob-logo b{color:var(--yellow)}
.ob-tag{color:var(--t2);font-size:0.88rem;margin-bottom:44px}
.ob-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--t2);margin-bottom:7px;display:block}
.ob-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;color:var(--text);font-family:var(--font);font-size:1rem;outline:none;
  margin-bottom:16px;-webkit-appearance:none}
.ob-input:focus{border-color:var(--yellow)}
.ob-btn{width:100%;padding:16px;background:var(--yellow);border:none;border-radius:14px;
  color:#000;font-family:var(--font);font-size:1rem;font-weight:800;cursor:pointer}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:var(--bg);
  border-bottom:1px solid var(--border);padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.1rem;font-weight:900}.logo b{color:var(--yellow)}
.hdr-right{display:flex;align-items:center;gap:10px}
.pack-pill{background:var(--card2);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:0.75rem;font-weight:700;color:var(--yellow);cursor:pointer}
.pack-pill:active{background:var(--card)}
.icon-btn{background:none;border:none;color:var(--t2);font-size:1.2rem;cursor:pointer;padding:4px 6px}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:9px 4px;background:none;border:none;color:var(--t3);font-family:var(--font);
  font-size:0.6rem;font-weight:600;cursor:pointer;gap:3px;text-transform:uppercase;letter-spacing:.05em}
.nb.on{color:var(--yellow)}
.ni{font-size:1.1rem;line-height:1}

/* TABS */
.tab{display:none;padding:16px;max-width:500px;margin:0 auto}
.tab.on{display:block}

/* SECTION LABEL */
.slabel{font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--t2);margin-bottom:9px;margin-top:2px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:12px}
.card.yellow-border{border-color:var(--yborder);background:var(--ybg)}
.card.green-border{border-color:var(--gborder);background:var(--gbg)}
.card.red-border{border-color:var(--rborder);background:var(--rbg)}
.card.blue-border{border-color:var(--bborder);background:var(--bbg)}

/* FLAG */
.flag{border-radius:14px;padding:13px 15px;margin-bottom:11px;display:none;animation:sIn .3s ease}
.flag.on{display:block}
.flag.warn{background:var(--ybg);border:1px solid var(--yborder)}
.flag.info{background:var(--bbg);border:1px solid var(--bborder)}
.fhead{font-size:0.78rem;font-weight:800;margin-bottom:3px}
.flag.warn .fhead{color:var(--yellow)}.flag.info .fhead{color:var(--blue)}
.fbody{font-size:0.71rem;color:var(--t2);line-height:1.5}

/* TODAY SECTION */
.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.today-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px}
.today-card.hl{border-color:var(--yborder);background:var(--ybg)}
.tc-label{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:7px}
.tc-amount{font-size:1.7rem;font-weight:900;line-height:1;margin-bottom:3px}
.tc-amount.y{color:var(--yellow)}.tc-amount.g{color:var(--green)}.tc-amount.b{color:var(--blue)}
.tc-sub{font-size:0.63rem;color:var(--t2)}

/* PROGRESS */
.prog-track{background:var(--border);border-radius:99px;height:10px;overflow:hidden;margin-bottom:9px}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease,background .3s}
.prog-fill.going{background:var(--yellow)}.prog-fill.done{background:var(--green)}
.prog-labels{display:flex;justify-content:space-between;font-size:0.68rem;color:var(--t2)}
.prog-labels b{color:var(--text);font-weight:700}

/* SAVINGS BAR */
.sav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sav-label{font-size:0.68rem;color:var(--t2)}
.sav-val{font-size:0.78rem;font-weight:800}
.sav-track{background:var(--border);border-radius:99px;height:7px;overflow:hidden}
.sav-fill{height:100%;border-radius:99px;transition:width .5s}
.sav-fill.personal{background:var(--green)}
.sav-fill.business{background:var(--blue)}

/* LOG DAILY */
.log-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.log-title{font-size:0.85rem;font-weight:800;margin-bottom:14px}
.input-row{display:flex;gap:10px;margin-bottom:12px}
.input-group{flex:1}
.ilabel{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--t2);margin-bottom:6px;display:block}
.ifield{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;color:var(--text);font-family:var(--font);font-size:1rem;font-weight:700;
  outline:none;-webkit-appearance:none;transition:border-color .2s}
.ifield:focus{border-color:var(--yellow)}
.ifield.small{font-size:0.88rem;font-weight:400}
.note-field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;color:var(--text);font-family:var(--font);font-size:0.85rem;
  outline:none;resize:none;height:44px;-webkit-appearance:none;margin-bottom:12px}
.note-field:focus{border-color:var(--yellow)}
.log-btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:var(--font);
  font-size:0.92rem;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s}
.log-btn:active{opacity:.85;transform:scale(.98)}
.log-btn.yellow{background:var(--yellow);color:#000}
.log-btn.red{background:var(--red);color:#fff}
.log-btn.outline{background:transparent;border:1px dashed var(--border);color:var(--t2)}
.log-btn.outline:active{border-color:var(--yellow);color:var(--yellow)}

/* DATE HEADER */
.date-header{display:flex;justify-content:space-between;align-items:center;
  background:var(--card2);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.date-str{font-size:0.78rem;font-weight:700}
.date-status{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:20px}
.date-status.open{background:var(--gborder);color:var(--green)}
.date-status.closed{background:var(--border);color:var(--t3)}

/* HISTORY ITEMS */
.day-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:8px}
.day-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-date{font-size:0.78rem;font-weight:700}
.day-total{font-size:1rem;font-weight:900;color:var(--yellow)}
.day-breakdown{display:flex;gap:12px}
.day-breakdown span{font-size:0.68rem;color:var(--t2)}
.day-breakdown b{font-weight:700;color:var(--text)}
.day-actions{display:flex;gap:8px;margin-top:8px}
.act-btn{background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 12px;color:var(--t2);font-family:var(--font);font-size:0.7rem;cursor:pointer}
.act-btn:active{border-color:var(--yellow);color:var(--yellow)}

/* EXPENSE ITEMS */
.exp-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.exp-item:last-child{border-bottom:none}
.exp-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-note{font-size:0.78rem;font-weight:600}
.exp-meta{font-size:0.62rem;color:var(--t2);margin-top:2px}
.exp-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.exp-amt{font-size:0.88rem;font-weight:800;color:var(--red)}
.exp-acts{display:flex;gap:8px}
.exp-act{background:none;border:none;font-size:0.8rem;cursor:pointer;opacity:.5}
.exp-act:active{opacity:1}

/* SUMMARY STAT ROWS */
.srow{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow-label{font-size:0.8rem;color:var(--t2)}
.srow-val{font-size:0.92rem;font-weight:800}
.srow-val.g{color:var(--green)}.srow-val.y{color:var(--yellow)}
.srow-val.r{color:var(--red)}.srow-val.w{color:var(--text)}.srow-val.b{color:var(--blue)}

/* PACK HISTORY CARD */
.phcard{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:8px}
.phcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.phcard-name{font-size:0.85rem;font-weight:800}
.phcard-rev{font-size:0.92rem;font-weight:900;color:var(--green)}
.phcard-meta{font-size:0.65rem;color:var(--t2);line-height:1.7}

/* SETTINGS */
.sg-title{font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--t2);margin-bottom:10px;margin-top:4px}
.srow-set{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.sl{font-size:0.85rem;font-weight:600}
.ss{font-size:0.65rem;color:var(--t2);margin-top:2px}
.sinput{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;color:var(--text);font-family:var(--font);font-size:0.9rem;
  width:100px;text-align:right;outline:none;-webkit-appearance:none}
.sinput:focus{border-color:var(--yellow)}
.sbtn{width:100%;padding:14px;border:none;border-radius:14px;font-family:var(--font);
  font-size:0.92rem;font-weight:800;cursor:pointer;margin-bottom:8px}
.sbtn.g{background:var(--green);color:#000}
.sbtn.r{background:transparent;border:1px solid var(--rborder);color:var(--red)}
.sbtn.o{background:transparent;border:1px solid var(--border);color:var(--t2)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;
  display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#1a1a1a;border-radius:20px 20px 0 0;padding:24px 20px;
  width:100%;max-width:500px;border-top:1px solid var(--border);
  animation:sUp .3s ease;padding-bottom:calc(24px + var(--sb))}
.mtitle{font-size:1rem;font-weight:800;margin-bottom:6px}
.msub{font-size:0.78rem;color:var(--t2);margin-bottom:18px;line-height:1.5}
.mfield{margin-bottom:12px}
.mlabel{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--t2);margin-bottom:6px;display:block}
.minput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;color:var(--text);font-family:var(--font);font-size:0.95rem;
  outline:none;-webkit-appearance:none}
.minput:focus{border-color:var(--yellow)}
.mrow{display:flex;gap:10px;margin-top:16px}
.mbtn{flex:1;padding:13px;border-radius:12px;font-family:var(--font);
  font-weight:800;cursor:pointer;font-size:0.88rem;border:none}
.mbtn.cancel{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.mbtn.ok{background:var(--yellow);color:#000}
.mbtn.del{background:var(--red);color:#fff}

/* PACK MODAL STATS */
.pm-stat{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:0.82rem}
.pm-stat:last-of-type{border-bottom:none}
.pm-stat span:last-child{font-weight:800;color:var(--yellow)}
.pm-end-btn{width:100%;padding:13px;background:var(--red);border:none;
  border-radius:12px;color:#fff;font-family:var(--font);font-weight:800;
  cursor:pointer;font-size:0.88rem;margin-top:14px}

/* TOAST */
.toast{position:fixed;bottom:calc(76px + var(--sb));left:50%;
  transform:translateX(-50%) translateY(20px);opacity:0;
  padding:11px 22px;border-radius:99px;font-weight:700;font-size:0.8rem;
  z-index:999;white-space:nowrap;font-family:var(--font);pointer-events:none;
  transition:transform .25s,opacity .25s}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast.g{background:var(--green);color:#000}
.toast.r{background:var(--red);color:#fff}
.toast.y{background:var(--yellow);color:#000}

select option{background:#1a1a1a}
@keyframes sIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="ob">
  <div class="ob-logo">Print<b>Flow</b></div>
  <div class="ob-tag">Your print business, under control.</div>
  <label class="ob-label">Your name</label>
  <input class="ob-input" id="obName" placeholder="e.g. Chidi" maxlength="30">
  <label class="ob-label">Business name (optional)</label>
  <input class="ob-input" id="obBiz" placeholder="e.g. Campus Prints">
  <button class="ob-btn" onclick="finishOB()">Let's Go 🚀</button>
</div>

<!-- PACK MODAL -->
<div class="overlay" id="packModal">
  <div class="modal">
    <div class="mtitle" id="pmTitle">Pack 1</div>
    <div class="msub">Current pack at a glance</div>
    <div id="pmStats"></div>
    <button class="pm-end-btn" onclick="endPack()">End This Pack</button>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('packModal')">Close</button>
    </div>
  </div>
</div>

<!-- LOG DAY MODAL -->
<div class="overlay" id="logModal">
  <div class="modal">
    <div class="mtitle" id="logModalTitle">Log Today</div>
    <div class="msub" id="logModalSub">Enter what you made today</div>
    <div class="mfield">
      <label class="mlabel">Cash (₦)</label>
      <input class="minput" type="number" id="lmCash" placeholder="0" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Transfer / Opay (₦)</label>
      <input class="minput" type="number" id="lmTransfer" placeholder="0" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Note (optional)</label>
      <input class="minput" type="text" id="lmNote" placeholder="e.g. busy day, slow day…" maxlength="60">
    </div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('logModal')">Cancel</button>
      <button class="mbtn ok" onclick="saveDay()">Save</button>
    </div>
  </div>
</div>

<!-- EDIT DAY MODAL -->
<div class="overlay" id="editDayModal">
  <div class="modal">
    <div class="mtitle">Edit Day</div>
    <div class="msub" id="editDaySub"></div>
    <div class="mfield">
      <label class="mlabel">Cash (₦)</label>
      <input class="minput" type="number" id="edCash" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Transfer / Opay (₦)</label>
      <input class="minput" type="number" id="edTransfer" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Note</label>
      <input class="minput" type="text" id="edNote" maxlength="60">
    </div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('editDayModal')">Cancel</button>
      <button class="mbtn ok" onclick="saveEditDay()">Save</button>
    </div>
  </div>
</div>

<!-- DELETE DAY MODAL -->
<div class="overlay" id="delDayModal">
  <div class="modal">
    <div class="mtitle">Delete this day?</div>
    <div class="msub" id="delDaySub"></div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('delDayModal')">Cancel</button>
      <button class="mbtn del" onclick="confirmDelDay()">Delete</button>
    </div>
  </div>
</div>

<!-- ADD EXPENSE MODAL -->
<div class="overlay" id="expModal">
  <div class="modal">
    <div class="mtitle">Log Expense</div>
    <div class="msub">This will be added to your cumulative expenses.</div>
    <div class="mfield">
      <label class="mlabel">Amount (₦)</label>
      <input class="minput" type="number" id="emAmt" placeholder="e.g. 3000" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Category</label>
      <select class="minput" id="emCat">
        <option value="Paper">Paper</option>
        <option value="Spiral Band">Spiral Band</option>
        <option value="Ink">Ink</option>
        <option value="Unforeseen">Unforeseen</option>
      </select>
    </div>
    <div class="mfield">
      <label class="mlabel">Note (optional)</label>
      <input class="minput" type="text" id="emNote" placeholder="e.g. bought new ink cartridge" maxlength="60">
    </div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('expModal')">Cancel</button>
      <button class="mbtn ok" style="background:var(--red);color:#fff" onclick="saveExp()">Add Expense</button>
    </div>
  </div>
</div>

<!-- EDIT EXPENSE MODAL -->
<div class="overlay" id="editExpModal">
  <div class="modal">
    <div class="mtitle">Edit Expense</div>
    <div class="mfield">
      <label class="mlabel">Amount (₦)</label>
      <input class="minput" type="number" id="eeAmt" inputmode="numeric">
    </div>
    <div class="mfield">
      <label class="mlabel">Category</label>
      <select class="minput" id="eeCat">
        <option value="Paper">Paper</option>
        <option value="Spiral Band">Spiral Band</option>
        <option value="Ink">Ink</option>
        <option value="Unforeseen">Unforeseen</option>
      </select>
    </div>
    <div class="mfield">
      <label class="mlabel">Note</label>
      <input class="minput" type="text" id="eeNote" maxlength="60">
    </div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('editExpModal')">Cancel</button>
      <button class="mbtn ok" onclick="saveEditExp()">Save</button>
    </div>
  </div>
</div>

<!-- DELETE EXPENSE MODAL -->
<div class="overlay" id="delExpModal">
  <div class="modal">
    <div class="mtitle">Delete this expense?</div>
    <div class="msub" id="delExpSub"></div>
    <div class="mrow">
      <button class="mbtn cancel" onclick="closeM('delExpModal')">Cancel</button>
      <button class="mbtn del" onclick="confirmDelExp()">Delete</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">Print<b>Flow</b></div>
  <div class="hdr-right">
    <div class="pack-pill" id="packPill" onclick="openPackModal()">Pack 1</div>
    <button class="icon-btn" onclick="goTab('settings')">⚙️</button>
  </div>
</header>

<!-- HOME TAB -->
<div class="tab on" id="tab-home">

  <div class="flag warn" id="fUnlogged">
    <div class="fhead">📋 Yesterday not logged yet</div>
    <div class="fbody" id="fUnloggedMsg"></div>
  </div>

  <!-- Today summary -->
  <div class="slabel">Today</div>
  <div class="today-grid">
    <div class="today-card hl">
      <div class="tc-labe
